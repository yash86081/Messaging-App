<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messaging Project</title>

</head>

<body>

    <!-- LOADING -->

    <div id="LoadingScreen">

        <div class="LoadingBox">

            <h1>Loading...</h1>

            <div class="LoadingSpinner"></div>

        </div>

    </div>


    <!-- AUTH -->

    <div id="Auth">

        <h1>Messaging Project</h1>


        <!-- SIGN UP -->

        <div id="SignupPage">

            <h2>Sign Up</h2>

            <input id="Username" placeholder="Username">

            <input id="Email" placeholder="Email">

            <input
                id="Password"
                type="password"
                placeholder="Password"
            >

            <button id="Signup">Sign Up</button>

            <p>Already have an account?</p>

            <button id="ShowLogin">Log in</button>

        </div>


        <!-- LOGIN -->

        <div id="LoginPage">

            <h2>Log In</h2>

            <input
                id="LoginEmail"
                placeholder="Email"
            >

            <input
                id="LoginPassword"
                type="password"
                placeholder="Password"
            >

            <button id="Login">Log In</button>

            <p>Don't have an account?</p>

            <button id="ShowSignup">Sign up</button>

        </div>

    </div>


    <!-- CHAT APP -->

    <div id="ChatApp">

        <!-- TOP BAR -->

        <div id="TopBar">

            <h1>Messaging</h1>

            <div id="TopButtons">

                <button id="SettingsButton">⚙️</button>

                <button id="Logout">Log Out</button>

            </div>

        </div>


        <!-- SETTINGS -->

        <div id="SettingsPanel">

            <h2>Settings</h2>

            <label>Profile picture URL</label>

            <input
                id="AvatarInput"
                placeholder="Paste image URL"
            >

            <button id="SaveAvatar">Save Profile Picture</button>


            <h3>Theme</h3>

            <button id="DarkTheme">Dark</button>

            <button id="LightTheme">Light</button>


            <h3>Message Effects</h3>

            <button id="EffectsOn">Effects On</button>

            <button id="EffectsOff">Effects Off</button>


            <button id="CloseSettings">
                Close
            </button>

        </div>


        <!-- MAIN -->

        <div id="Container">


            <!-- CHAT LIST -->

            <div id="Chats">

                <h2>Chats</h2>

                <div id="UserList"></div>

            </div>


            <!-- CHAT -->

            <div id="Chat">

                <div id="ChatHeader">

                    <div id="ChatUserInfo">

                        <img
                            id="ChatAvatar"
                            class="Avatar"
                            src=""
                            alt=""
                        >

                        <div>

                            <h2 id="ChatTitle">
                                Select a chat
                            </h2>

                            <p id="TypingIndicator"></p>

                        </div>

                    </div>

                </div>


                <!-- MESSAGES -->

                <div id="Messages">

                    <p id="EmptyChat">
                        Select someone to start chatting.
                    </p>

                </div>


                <!-- REPLY BAR -->

                <div id="ReplyBar">

                    <div>

                        <strong id="ReplyName">
                            Replying
                        </strong>

                        <p id="ReplyText"></p>

                    </div>

                    <button id="CancelReply">
                        ✕
                    </button>

                </div>


                <!-- MESSAGE INPUT -->

                <div id="MessageBar">

                    <input
                        id="Input"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button id="Send">
                        Send
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
