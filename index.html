<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaging Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-black">

<div id="LoadingScreen">
    <div id="LoadingBox">
        <h1>Messaging</h1>
        <p id="LoadingText">Loading...</p>
        <div id="LoadingBar"><div id="LoadingProgress"></div></div>
    </div>
</div>

<div id="Auth">
    <h1>Messaging Project</h1>
    <div id="SignupPage">
        <h2>Sign Up</h2>
        <input id="Username" placeholder="Username" maxlength="30">
        <input id="Email" placeholder="Email">
        <input id="Password" type="password" placeholder="Password">
        <button id="Signup">Sign Up</button>
        <p>Already have an account?</p>
        <button id="ShowLogin">Log In</button>
    </div>
    <div id="LoginPage">
        <h2>Log In</h2>
        <input id="LoginEmail" placeholder="Email">
        <input id="LoginPassword" type="password" placeholder="Password">
        <button id="Login">Log In</button>
        <p>Don't have an account?</p>
        <button id="ShowSignup">Sign Up</button>
    </div>
</div>

<div id="ChatApp">
    <div id="TopBar">
        <h1>Messaging</h1>
        <button id="SettingsButton">⚙️</button>
    </div>

    <div id="SettingsPanel">
        <h2>Settings</h2>

        <h3>Profile</h3>
        <div id="SettingsAvatar"></div>
        <input id="AvatarFile" type="file" accept="image/*">
        <button id="UploadAvatar">Upload Picture</button>
        <input id="ProfileUsername" placeholder="Username" maxlength="30">
        <button id="SaveProfile">Save Profile</button>

        <h3>Theme</h3>
        <div id="ThemeButtons">
            <button data-theme="black">⚫ Black</button>
            <button data-theme="blue">🔵 Blue</button>
            <button data-theme="yellow">🟡 Yellow</button>
            <button data-theme="red">🔴 Red</button>
            <button data-theme="green">🟢 Green</button>
            <button data-theme="pink">🩷 Pink</button>
        </div>

        <h3>Stickers</h3>
        <input id="StickerFile" type="file" accept="image/*">
        <button id="UploadSticker">Upload Sticker</button>

        <h3>Notifications</h3>
        <button id="EnableNotifications">Enable Notifications</button>

        <button id="Logout">Log Out</button>
        <button id="CloseSettings">Close</button>
    </div>

    <div id="Container">
        <div id="Chats">
            <h2>Chats</h2>
            <input id="UserSearch" placeholder="Search messages...">
            <div id="UserList"></div>
        </div>

        <div id="Chat">
            <div id="ChatHeader">
                <div id="ChatAvatar"></div>
                <div>
                    <h2 id="ChatTitle"></h2>
                    <p id="ChatStatus"></p>
                </div>
            </div>

            <div id="Messages"></div>

            <div id="ReplyBar">
                <div>
                    <strong id="ReplyName"></strong>
                    <p id="ReplyText"></p>
                </div>
                <button id="CancelReply">✕</button>
            </div>

            <div id="StickerPanel"></div>

            <div id="MessageBar">
                <button id="FileButton">📎</button>
                <input id="FileInput" type="file">
                <button id="StickerButton">😀</button>
                <textarea id="Input" placeholder="Type a message..." autocomplete="off" rows="1"></textarea>
                <button id="Send">Send</button>
            </div>
        </div>
    </div>
</div>

<div id="MessageMenu">
    <button data-action="reply">↩ Reply</button>
    <button data-action="copy">📋 Copy</button>
    <button data-action="edit">✏️ Edit</button>
    <button data-action="delete">🗑️ Delete</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
